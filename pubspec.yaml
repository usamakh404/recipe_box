name: recipe_box
description: A warm, elegant recipe-management app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Navigation
  go_router: ^14.2.7

  # State management (lightweight — matches app scale)
  provider: ^6.1.2

  # Firebase
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4

  # Typography (Playfair Display + DM Sans, no bundled font assets)
  google_fonts: ^6.2.1

  # Images
  cached_network_image: ^3.4.1

  # Local persistence for favorites/recently-viewed
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
